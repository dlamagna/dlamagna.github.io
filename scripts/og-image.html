<!DOCTYPE html>
<!-- Template for assets/img/og-image.png (1200x630). The headline is filled in by scripts/sync.py.
     Re-take it with the command in README.md ("Social preview image"). Not linked from the site. -->
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Preview image template</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #fbfbf9; color: #16191d;
    display: grid; grid-template-columns: 1fr 300px; gap: 56px; align-items: center;
    padding: 0 84px; box-sizing: border-box;
    border-top: 14px solid #0f6b63;
  }
  .name { font-size: 64px; font-weight: 800; letter-spacing: -1.5px; margin: 0; }
  .headline { font-size: 33px; line-height: 1.32; font-weight: 500; margin: 22px 0 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .tags span { background: #e6f1ef; color: #0b4f49; border-radius: 999px; padding: 6px 16px; font-size: 21px; font-weight: 600; }
  .url { margin-top: 30px; font-size: 22px; color: #4f5964; font-weight: 600; }
  img { width: 300px; height: 300px; border-radius: 50%; object-fit: cover; border: 6px solid #fff; box-shadow: 0 8px 30px rgba(0,0,0,.12); }
</style>
</head>
<body>
  <div>
    <h1 class="name">Davide Lamagna</h1>
    <p class="headline"><!-- sync:headline -->Track record of taking early-stage products from first prototype to live clients: I build them, run them as a product, and get customers onboarded.<!-- /sync:headline --></p>
    <div class="tags"><span>Software engineer</span><span>Technical product manager</span><span>Implementation engineer</span><span>Research engineer</span></div>
    <div class="url">dlamagna.github.io</div>
  </div>
  <img src="../assets/img/profile-og.jpg" alt="">
</body>
</html>
